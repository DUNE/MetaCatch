################################################################################
#                         DUNE MetaData Specification                          #
################################################################################

# This file attempts to define a standard DUNE metadata spec, based on:
# 1. The DUNE DataCatalogDocs glossary: https://dune.github.io/DataCatalogDocs/glossary.html
# 2. Old scripts from data-mgmt-ops: https://github.com/DUNE/data-mgmt-ops/tree/master/utilities
# 3. Existing metadata values found by scanning the MetaCat database

################################################################################
#                       MetaData Key And Category Naming                       #
################################################################################

# MetaCat stores file metadata as a dictionary of key, value pairs.
# Keys must be strings, while the value type and constraints vary by key.
# Keys are grouped into categories (and optionally into subcategories).
# Categories are specified by including them in the key name separated by periods, for example
#   "category.subcategory.parameter"
# Note that subcategories and keys may share the same name, for example
#   "core.application.name" is in the "core.application" category, but that is also a valid key.

# The full list of requirements for key names is:
# - Keys must be strings consisting of a series of segments delimited by periods
# - Keys must contain at least one period (two segments, "category.parameter")
# - Keys cannot begin or end with a period or contain consecutive periods (no empty segments)
# - The first character of each segment must be a lowercase letter
# - All other characters must be either lowercase letters, numbers, or underscores

################################################################################
#                             Category Definitions                             #
################################################################################

# Categories may have an associated description, and also 'required' or 'restricted' flags.
# If a category is required, at least one key in that category must exist.
# Categories will automatically be flagged as required if they contain any required keys.
# If a category is restricted, only keys explicity defined in the spec are allowed.
# Otherwise, users may freely add new keys in unrestricted categories.
# MetaCatch will set required to false and restricted to true by default.
# Note that this is different from MetaCat, which sets restricted to false by default!

# The CATEGORIES dictionary below contains category definitions of the form:
#   category_name:
#       description:    string describing the category
#       required:       boolean (default false)
#       restricted:     boolean (default true)

# Categories with default settings can also be defined by simply providing a description string:
#   category_name:      description

# Categories may also be defined separately, to keep them close to the related keys.
# This is done by prefixing the category name with CATEGORY:
#   CATEGORY category_name: description

# Note that key definitions may impact their parent categories:
# - Any missing category definitions will be created automatically with default settings
# - Required keys will automatically flag all parent categories as required

CATEGORIES:
    ~: # Default behavior for all categories unless overridden
        required:       false
        restricted:     true
    core:
        description:    "Generally required metadata keys"
        required:       true
    dune:
        description:    "DUNE-specific metadata keys"
        required:       true
    dune_mc:            "DUNE Monte Carlo simulation metadata keys"
    merge:              "Keys used for merge jobs"

################################################################################
#                             Condition Definitions                            #
################################################################################

# Most keys are optional, while others are standard requirements for all files.
# However, some keys may be required for some types of files but not for others.
# MetaCatch therefore includes a set of conditions that can trigger additional required keys.
# Conditions may use one or both of the following approaches:

# Expression-based conditions evaluate an arbitrary boolean expression, provided as a string.
# Expressions may use any metadata key or file property (name, namespace, ...) as a variable.
# Expressions use standard python syntax, and most read-only operations are supported.
# A subset of standard functions and operators are also available (len, sum, dict.keys, ...).
# Missing keys evaluate to None, and conditions with evaluation errors will be treated as False.
# Note that these conditions are ignored by MetaCat's server-side metadata validation!

# Category-based conditions are simpler, and evalue to True if any key in the category exists.
# This mirrors the server-side validation behavior for required keys in optional categories.
# The server-side validation should apply these conditions to keys in the given category.
# Note that the server-side validation ignores these conditions for keys outside the category!

# The CONDITIONS dictionary below contains condition definitions of the form:
#   condition_name:
#       expression:   string containing a boolean expression
#       category:     string containing a category name

# Expression-based conditions may also be defined by simply providing the expression string:
#   condition_name:      expression

# As with categories, conditions may also be defined separately by prefixing them with CONDITION:
#   CONDITION condition_name: expression

# Condition names should be descriptive, and will be inserted into error messages as:
#   "ERROR:     Missing key '{key_name}' is required for {condition_name} files"

CONDITIONS:
    "CAF": "core.data_tier == 'caf'"
    "raw": "core.data_tier in ['raw', 'binary-raw', 'trigprim']"
    "root-tuple": "core.data_tier in ['root-tuple', 'root-tuple-virtual']"
    "application output":
        expression: "core.application is not None"
        category:   "core.application"
    "origin":
        category:   "origin.applications"
    "Monte Carlo": 
        expression: "core.file_type == 'mc'"
        category:   "dune_mc"

################################################################################
#                               Key Definitions                                #
################################################################################

# Metadata keys are defined by providing a dictionary using the full key name.
# All keys accept the following standard attributes:
#   category.key_name:
#       description:    string describing the key
#       required:       boolean or condition name (default: False)
#       status:         current, deprecated, or retired (default: current)
#       type:           type of the value, see below (default: any)
#       merge:          merging behavior for multiple files, see below (default: strict)
#       default:        default value for missing required keys (default: None)
#       fixes:          mapping of incorrect values to corrected values
#       checks:         list of additional checks, see below

# Keys that are logically boolean are often stored as integers (1, 0) or strings ("yes", "no").
# To support this, boolean keys accept an additional attribute:
#   category.boolean_key:
#       values:         list of values used to represent true and false (default: [True, False])
# The values list must contain exactly two elements:
# - One truthy value (True, 1, "true", "t", "yes", "y", "on")
# - One falsy value (False, 0, "false", "f", "no", "n", "off")

# Many keys are restricted to a small set of specific allowed options.
# These keys may use three additional attributes:
#   category.key_with_options:
#       options:        mapping of allowed values to human-readable descriptions
#       old_options:    mapping of deprecated values to human-readable descriptions
#       bad_options:    mapping of retired values to human-readable descriptions
# Keys must have at least one valid option, otherwise the key itself should be deprecated/retired.
# Option descriptions may be empty, but should be provided if possible.
# Descriptions for deprecated and retired options should explain why they are no longer allowed.
# Retired values with direct replacements should use the fixes attribute instead of bad_options!

# Alternatively, numeric and string keys may be be restricted to a range or specific pattern.
# These keys may use three additional attributes:
#   category.parametric_key:
#       min:            minimum allowed value (numeric or string)
#       max:            maximum allowed value (numeric or string)
#       pattern:        regular expression (string values only)
# Keys may use any or all of these attributes, but they cannot be combined with explicit options.
# The pattern string is evaluated using standard regex syntax.

# Invalid and retired keys with direct replacements should not provide a specification.
# Instead, these keys should simply map directly to the correct key:
#   category.retired_key:   new_category.replacement_key
#   Malformed-Key:          fixed_category.fixed_key

# There are also many keys in the database but are not yet defined in this specification.
# These keys are included in this file, but with an empty specification.
# They are assumed to be valid but deprecated by default.
#   category.unknown_key:   # Empty spec, defaults to deprecated

# Any keys not listed in this file are considered invalid by default.

################################################################################
#                         Key Attribute Clarifications                         #
################################################################################

# Key types are specified using the standard python type names:
#   str, int, float, bool, list, set, dict
# List, set, and dict keys may specify a value type, and dicts may also specify a key type:
#   list[val_type], set[val_type], dict[val_type], dict[key_type, val_type]
# Sets are not JSON-serializable, and are stored as sorted lists.
# Note that this differs from the MetaCat server type syntax, which uses the following type names:
#   text, int, float, boolean, list, dict, text[], int[], float[], boolean[], any

# MetaCatch supports merging metadata from multiple files, using the specified mode for each key.
# All keys support the following merge modes:
#   strict:     All values must be identical, otherwise an error is raised (default)
#   equal:      Keep the key if there is a single unique value, otherwise delete it
#   delete:     Delete the key from the merged metadata
# Additional merge modes are available depending on the key type:
#   bool:       any, all
#   numeric:    sum, min, max
#   str:        append, sorted (sorts and deduplicates values before joining)
#   list:       append
#   set, dict:  union, intersect
# The string merge methods accept an optional argument to specify the join string, for example:
#   sorted(, ): Sorts and deduplicates values, then joins them with ', ' as the separator
# The dict merge methods delete dict keys with conflicting values, for union this throws an error.

# The checks attribute allows more complex cross-key validation rules to be specified.
# It consists of a list of boolean expression strings, similar to condition expressions.
# As before, expressions may refer to any metadata key or file property as a variable.
# Check expressions may also use 'self' as a shorthand to refer to the key in question.
# Checks are only evaluated for keys that exist, and are ignored for missing keys.
# However, any missing required keys will be added first so their checks will also be evaluated.

# Note that deprecated and retired designations only apply to MetaCatch, not to MetaCat.
# Using MetaCatch for client-side validation, the behavior is as follows:
# - Deprecated keys/values are valid but will cause a warning to be issued
# - Retired values are invalid, and MetaCatch will reccomend the key's default value if available
# - Retired keys are invalid, and MetaCatch will reccomend deleting them
# The MetaCat server-side validation instead uses the following behavior:
# - Deprecated keys/values are treated as completely valid and will not cause any warning
# - Retired values are omitted, and will raise an error like any other invalid value
# - Retired keys have different behavior depending on whether the category is restricted:
#     - Restricted:   Keys are omitted, and raise an error like any other invalid key
#     - Unrestricted: Keys are given an empty list of values, and should raise an error if used

