    values: ["yes", "no"]

mc.with_cosmics:    dune_mc.with_cosmics
dune_mc.with_cosmics:
    description: "Whether cosmic rays are included in the simulation"
    type: bool
    values: [0, 1]

beam.momentum:
    description: "Beam momentum in GeV/c"
    type: float

beam.polarity:
    description: "Beam polarity"
    type: int
    options:
        1:      "Neutrino mode"
        -1:     "Antineutrino mode"

