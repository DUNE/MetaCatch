################################################################################
#                              MetaCatch Settings                              #
################################################################################

# This file controls the behavior of the MetaCatch program
# The actual metadata specification is defined in the specification.yaml file

################################################################################
#                              Error Flag Classes                              #
################################################################################

# Group error flags into classes for reporting and filtering
error_groups:
    CRITICAL: ["MRG_CONFLICT"]
    WARNING:  ["KEY_DEPRECATED", "KEY_UNKNOWN", "KEY_SPEC", "VAL_DEPRECATED", "MRG_ORDERED"]
    INFO:     ["KEY_DESC", "VAL_DESC", "VAL_CONVERTED", "MRG_MODIFIED"]
    DELETED:  ["KEY_RETIRED", "USR_DELETED", "MRG_DELETED"]
    UNFIXABLE: ["KEY_UNKNOWN", "KEY_RETIRED", "VAL_RETIRED"]
    UNAMBIGUOUS: ["KEY_UNKNOWN", "MRG_SUBSET"]

################################################################################
#                                Error Messages                                #
################################################################################

# For a given category and severity of error, the first message with matching flags will be used.
# Multiple consecutive spaces are interpreted as a 'tab', and are used to align the message output.
# The message may contain placeholders for the key, value, and other relevant information:
#   Key Placeholders:
#       {k}  - key name (including any reccomended changes)
#       {ki} - initial key name
#       {kf} - final key name
#       {ks} - list of possible key names
#       {ko} - key options message (e.g. "did you mean one of: 'a', 'b', 'c'?")
#       {kd} - key description
#       {ke} - key error flags
#   Value Placeholders:
#       {v}  - value (including any recommended changes)
#       {vi} - initial value
#       {vf} - final value
#       {vs} - list of possible values
#       {vo} - value options message (e.g. "did you mean one of: 'a', 'b', 'c'?")
#       {vd} - value description
#       {ve} - value error flags
#   Other Placeholders:
#       {ue} - user error flags
#       {me} - merge error flags
#       {e}  - all error flags
#       {t}  - key type
#       {c}  - condition name (or "all" or "no" for absolute conditions)

mrg_error_messages:
    CRITICAL:
      - CONFLICT:   "{k}                Merge encountered conficting values {vs}"
    ERROR:
      - MISSING:    "{k}                Merge encountered missing values"
    FIX:
      - DELETED:    "{k}                Deleted during merging"
      - SUBSET:     "{k}                Merge omitted some values: {v[1]}"
    WARNING:
      - ORDERED:    "{k}                Merged output depends on input file order"
    INFO:
      - MODIFIED:   "{k}                Merge modified value to {vf}"
    ~:              "{k}                Unhandled merging error(s): {me}"

usr_error_messages:
    ERROR:
      - DELETED:    "{k} ({v})          Key should be deleted by user override"
      - OVERRIDE:   "{k} ({vi})         Val should be set to user override {vf}"
      - DEFAULT:    "{k} (missing)      Val should be set to user default value {vf}"
    FIX:
      - DELETED:    "{k} ({v})          Key deleted by user override"
      - OVERRIDE:   "{k} ({vi})         Val set to user override {vf}"
      - DEFAULT:    "{k} (missing)      Val set to user default {vf}"
    ~:              "{k} ({v})          Unhandled user error(s): {ue}"

key_error_messages:
    CRITICAL:
      - REQUIRED|USR_DELETED:
                    "{k} (user del)     Key is required for {c} files!"
      - REQUIRED|MRG_DELETED:
                    "{k} (mrg del)      Key is required for {c} files!"
      - REQUIRED:   "{k} (missing)      Key is required for {c} files!"
      - ILLEGAL:    "{ki}               Key name is illegal, {ko}"
      - INVALID:    "{ki}               Key is invalid, {ko}"
    ERROR:
      - REQUIRED:   "{k} (missing)      Key is required for {c} files (default {v})"
      - CONFLICT:   "{ki} ({vi})        Key conflicts with replacement {kf} (val {vf})"
      - REDUNDANT:  "{ki} ({vi})        Key is redundant with replacement {kf}"
      - ILLEGAL:    "{ki}               Key name is illegal, {ko}"
      - RETIRED:    "{k}                Key is retired: {kd}"
      - REPLACED:   "{ki}               Key is retired, use {kf} instead"
      - INVALID:    "{ki}               Key is invalid, {ko}"
      - UNKNOWN:    "{ki}               Key is unknown, {ko[1]}"
    FIX:
      - REQUIRED:   "{k} (missing)      Val set to default {v} (required for {c} files)"
      - CONFLICT:   "{ki} ({vi})        Key deleted, conflicts with {kf} (val {vf})"
      - REDUNDANT:  "{ki} ({vi})        Key deleted, redundant with {kf}"
      - ILLEGAL:    "{ki}               Key name is illegal, replaced with {kf}"
      - RETIRED:    "{k}                Key is retired, deleted: {kd}"
      - REPLACED:   "{ki}               Key is retired, replaced with {kf}"
      - INVALID:    "{ki}               Key is invalid, replaced with {kf}"
    WARNING:
      - SPEC:       "{k}                Key is deprecated (missing specification)"
      - DEPRECATED: "{k}                Key is deprecated: {kd}"
      - UNKNOWN:    "{k}                Key is unknown, are you sure it is correct?"
    INFO:
      - DESC:       "{k}                Key is valid, but has no description"
    ~:              "{ki}               Unhandled key error(s): {ke}, {ko}"

val_error_messages:
    CRITICAL:
      - INVALID:    "{k} ({vi})         Val is invalid, {vo}"
      - TYPE:       "{k} ({vi})         Val has wrong type, expected {t}"
      - RETIRED|DESC:
                    "{k} ({vi})         Val is retired, {vo}"
      - RETIRED:    "{k} ({vi})         Val is retired: {vd}"
    ERROR:
      - REPLACED:   "{k} ({vi})         Val is retired, use {vf} instead"
      - RETIRED|DESC:
                    "{k} ({vi})         Val is retired, {vo}"
      - RETIRED:    "{k} ({vi})         Val is retired: {vd}"
      - TYPE:       "{k} ({vi})         Val has wrong type, {vo}"
      - INVALID:    "{k} ({vi})         Val is invalid, {vo}"
      - MIN:        "{k} ({vi})         Val below minimum {vf}"
      - MAX:        "{k} ({vi})         Val above maximum {vf}"
    FIX:
      - REPLACED:   "{k} ({vi})         Val is retired, replaced with {vf}"
      - TYPE:       "{k} ({vi})         Val has wrong type, replaced with {vf}"
      - INVALID:    "{k} ({vi})         Val is invalid, replaced with {vf}"
      - MIN:        "{k} ({vi})         Val clamped to minimum {vf}"
      - MAX:        "{k} ({vi})         Val clamped to maximum {vf}"
    WARNING:
      - DEPRECATED: "{k} ({vi})         Val is deprecated: {vd}"
    INFO:
      - DESC:       "{k} ({v})          Val is valid, but has no description"
      - CONVERTED:  "{k} ({vi})         Val converted to {vf}"
    ~:              "{k} ({vi})         Unhandled val error(s): {ve}, {vo}"

################################################################################
#                             Printout Formatting                              #
################################################################################

# Settings for trying to fit messages into a given width
field_widths:
    default_width: 40
    min_element_count: 1    # Display at least this many elements in a list/set/dict
    min_string_width: 5     # Display at least this many characters at ends of a string

colorization:
    enabled: true           # Enable colorized output
    fields:
        files:      CYAN    # Color for file names
        keys:       CYAN    # Color for keys
        values:     WHITE   # Color for values
    error_severities:
        CRITICAL:   RED
        ERROR:      YELLOW
        FIX:        GREEN
        WARNING:    BLUE
        INFO:       CYAN

################################################################################
#                             Key & Value Matching                             #
################################################################################

# Metadata keys may only contain lower case letters, underscores, and periods.
# MetaCatch will attempt to correct illegal keys by converting letters to lower case.
# Other characters will be replaced with underscores, unless another substitution is specified:
allowed_key_characters:
    '.': '.,;:'

# Edit distance settings for fuzzy matching keys and values
edit_distance:
    shift: 0.5 # Additional edit distance for shifted keys (in units of key widths)
    ratio: 0.3 # Maximum fractional edit distance to match
    limit: 9.0 # Maximum absolute edit distance to match
    delta: 2.0 # Minimum edit distance difference to unambiguously select a better match
    keyboard_layout: US_QWERTY # Keyboard layout to use for edit distance calculations

misc:
    allow_unknown_subcategories: true # Allow unknown subcategories in unrestricted categories