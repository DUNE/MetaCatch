dune_mc.with_cosmics:
    description: "Whether cosmic rays are included in the simulation"
    type: int
    options:
        0:                          "no"
        1:                          "yes"

beam.momentum:
    type: float

beam.polarity:
    type: int
    options:
        1:
        -1:

