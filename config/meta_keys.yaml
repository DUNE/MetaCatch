    type: str

merge.cmd:
    description: "Command used to merge files"
    type: str

merge.script:
    description: "Runner script used to perform the merge"
    type: str

merge.cfg:
    description: "Configuration file for merging runner script"
    type: str

merge.query:
    description: "MetaCat query used to select files for merging"
    type: str

merge.dataset:
    description: "Name of the dataset being merged"
    type: str

merge.tag:
    description: "Tag to identify the merge job"
    type: str

merge.comment:
    description: "Comment describing the merge job"
    type: str

merge.skip:
    description: "Number of files skipped during merging"
    type: int

merge.limit:
    description: "Maximum number of input files to merge"
    type: int

merge.chunk:
    description: "Chunk number for this file (if splitting a large merge)"
    type: int

merge.final:
    description: "Whether this is the final output of a merge (vs an intermediate file)"
    type: bool

merge.timestamp:
    description: "Timestamp when the merge was performed"
    type: str

merge.version:
    description: "Version of the merging software used"
    type: str

merge.hash:
    description: "Hash of input files used to identify merge jobs, superseded by merge.tag"
